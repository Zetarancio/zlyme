version: 1
kind: CompositeDevice
name: External Gamepad
matches: []
maximum_sources: 1
options:
  auto_manage: false
  persist: false
source_devices:
  - group: gamepad
    udev:
      properties:
        - name: ID_INPUT_JOYSTICK
          value: "1"
      sys_name: "event*"
      subsystem: input
target_devices:
  - xb360
