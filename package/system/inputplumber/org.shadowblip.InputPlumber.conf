<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Zlyme has no polkit. The daemon is started with
       INSECURE_DISABLE_POLKIT=1, so only root may own or call it. -->
  <policy user="root">
    <allow own="org.shadowblip.InputPlumber"/>
    <allow send_destination="org.shadowblip.InputPlumber"/>
    <allow receive_sender="org.shadowblip.InputPlumber"/>
  </policy>
  <policy context="default">
    <deny own="org.shadowblip.InputPlumber"/>
    <deny send_destination="org.shadowblip.InputPlumber"/>
    <deny receive_sender="org.shadowblip.InputPlumber"/>
  </policy>
</busconfig>
