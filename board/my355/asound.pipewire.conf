# Product default. Installed over /etc/asound.conf by post-build.sh
# when PipeWire is selected. The minimal image keeps the overlay file.

pcm.!default {
	type pipewire
}

ctl.!default {
	type pipewire
}

pcm.hw_codec {
	type hw
	card rk817ext
	device 0
}

pcm.hw_hdmi {
	type hw
	card HDMI
	device 0
}
