# Initramfs finds LABEL=ZLYMEBOOT and loop-mounts the squashfs file
# named zlyme. FDT is the kernel dtb name; do not rename it.
# console=tty1 is the LCD framebuffer. console=ttyS2 last so
# /dev/console stays the serial port and the ttyS2 getty is unchanged.
# Kernel lines go to both. quiet suppresses those lines and selects
# the graphical splash. Without quiet, rcS also copies its output to tty1.

DEFAULT zlyme

LABEL zlyme
    KERNEL /Image.gz
    FDT /rk3566-miyoo-flip.dtb
    APPEND label=ZLYMEBOOT earlycon quiet console=tty1 console=ttyS2,1500000n8
