# Initramfs finds LABEL=ZLYMEBOOT and loop-mounts the squashfs file
# named zlyme. FDT is the kernel dtb name; do not rename it.
# console=ttyS2,1500000n8 last so serial is /dev/console.

DEFAULT zlyme

LABEL zlyme
    KERNEL /Image.gz
    FDT /rk3566-miyoo-flip.dtb
    APPEND label=ZLYMEBOOT earlycon quiet console=ttyS2,1500000n8
