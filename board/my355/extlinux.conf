# root=PARTLABEL=rootfs. FDT is the kernel dtb name; do not rename it.
# console=ttyS2,1500000n8 last so serial is /dev/console.

DEFAULT zlyme

LABEL zlyme
    KERNEL /Image
    FDT /rk3566-miyoo-flip.dtb
    APPEND root=PARTLABEL=rootfs rootfstype=squashfs ro rootwait earlycon console=tty1 console=ttyS2,1500000n8
