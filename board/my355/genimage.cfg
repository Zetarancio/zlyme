# Zlyme SD image for my355.
# idbloader at 32K (bootrom). u-boot FIT at 8M, GPT name "uboot".
# No rootfs GPT partition: the squashfs is a file named zlyme on FAT.

image boot.vfat {
	vfat {
		label = "ZLYMEBOOT"
		extraargs = "-F 32"
		files = {
			"Image",
			"rk3566-miyoo-flip.dtb",
			"extlinux",
			"overlays",
			"zlyme-boot.conf",
			"zlyme",
			"splash.anim",
			"progress.anim",
		}
	}
	# Live OS file + kernel only. Pending squashfs stays on ZLYME.
	# 1300M is 1.3GB; do not size this from the current squashfs.
	size = 1300M
}

image zlyme.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition idbloader {
		in-partition-table = false
		image = "idbloader.img"
		offset = 32K
	}

	partition uboot {
		partition-type-uuid = "L"
		image = "u-boot.itb"
		offset = 8M
		size = 4M
	}

	partition boot {
		partition-type-uuid = "F"
		image = "boot.vfat"
		offset = 12M
		bootable = true
	}

	partition storage {
		partition-type-uuid = "L"
		image = "storage.exfat"
	}
}
