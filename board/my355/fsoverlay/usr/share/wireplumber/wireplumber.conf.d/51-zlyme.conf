# WirePlumber 0.5.14. main-embedded is the system-wide profile that
# already disables ALSA reservation, logind, and BlueZ seat monitoring,
# and does not store route state on disk. Do not repeat those switches.
context.properties = {
  wireplumber.profile = main-embedded
}

wireplumber.profiles = {
  main-embedded = {
    policy.zlyme-volume = required
    policy.zlyme-sink = required
  }
}

wireplumber.components = [
  {
    name = zlyme-volume.lua, type = script/lua
    provides = policy.zlyme-volume
  }
  {
    name = zlyme-policy.lua, type = script/lua
    provides = policy.zlyme-sink
  }
]

wireplumber.settings = {
  linking.follow-default-target = true
  linking.allow-moving-streams = true
  # Upstream default is 0.064. 0.0 left every sink silent when the
  # shell could not see the node. Saved 0 is still applied by zlyme-audio.
  device.routes.default-sink-volume = 0.064
}

# Send audio to headphones. Do not take the headset or hands-free role.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source ]
  bluez5.codecs = [ sbc ]
  bluez5.hfphsp-backend = "none"
}

# Playback nodes on this board publish alsa.id, not api.alsa.card.id.
# The descriptive name rk817_ext is not the id. These priorities are the
# backup if the policy hook is not loaded: A2DP, then the codec, then
# HDMI. zlyme-policy.lua is the selector. It can pick HDMI when the ELD
# has a format, and an explicit preference beats a higher priority.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        alsa.id = "rk817ext"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        alsa.id = "HDMI"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1000
      }
    }
  }
]

# bluez5.roles a2dp_source is the local sender. bluez5.auto-connect
# a2dp_sink is the remote Audio Sink UUID 0000110b. When that Device1
# object already lists the UUID, PipeWire calls ConnectProfile once.
# That can page a paired trusted headset. It is not a reconnect loop,
# and it does nothing for a device BlueZ has not registered. A HID pad
# has no Audio Sink UUID. HSP and HFP are not in the list: the backend
# is none.
monitor.bluez.rules = [
  {
    matches = [
      { device.name = "~bluez_card.*" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink ]
      }
    }
  }
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
      }
    }
  }
]
