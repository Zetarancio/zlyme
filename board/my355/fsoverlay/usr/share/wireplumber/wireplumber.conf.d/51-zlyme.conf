# No logind seat and no ALSA reservation daemon on this image.
monitor.alsa.properties = {
  alsa.reserve = false
}

monitor.bluez.properties = {
  bluez5.hfphsp-backend = "none"
  bluez5.roles = [ a2dp_sink ]
}

# Session priority: A2DP, then HDMI, then the RK817 card id rk817ext.
# Card indexes are not used. A missing node simply is not a candidate.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "rk817ext" }
    ]
    actions = {
      update-props = {
        priority.session = 1000
      }
    }
  }
  {
    matches = [
      { api.alsa.card.name = "HDMI" }
    ]
    actions = {
      update-props = {
        priority.session = 1500
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  }
]
