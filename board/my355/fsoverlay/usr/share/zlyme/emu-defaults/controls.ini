# PPSSPP controller map. KeyMap.cpp loads [ControlMapping] from
# controls.ini, not from ppsspp.ini. Device 10 is DEVICE_ID_PAD_0.
# SDLJoystick.cpp getKeycodeForButton:
#   SDL A 189 east, SDL B 190 south, SDL X 191 north, SDL Y 188 west,
#   L 193, R 192, Select 196, Start 197, d-pad 19-22.
# Axis codes are AXIS_BIND_NKCODE_START (4000) plus the SDL axis
# index times two, with the odd code negative. Left stick is axes
# 0 and 1. Right stick is axes 3 and 4.
# Guide is not bound. zlyme-pak-hotkey owns MENU+START.
[ControlMapping]
Up = 10-19
Down = 10-20
Left = 10-21
Right = 10-22
Circle = 10-189
Cross = 10-190
Square = 10-188
Triangle = 10-191
Start = 10-197
Select = 10-196
L = 10-193
R = 10-192
An.Up = 10-4003
An.Down = 10-4002
An.Left = 10-4001
An.Right = 10-4000
RightAn.Up = 10-4009
RightAn.Down = 10-4008
RightAn.Left = 10-4007
RightAn.Right = 10-4006
