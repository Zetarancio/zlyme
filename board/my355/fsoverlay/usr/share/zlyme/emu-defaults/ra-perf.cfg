# Spruce Flip performance keys plus MENU binds. ra-run --appendconfig
# merges this after /etc/retroarch.cfg so an older image still gets them
# from the card. ROCKNIX/Knulli on this pad: udev, MENU = js/BTN_MODE 10.
# Enable Hotkey stays nul so a MENU tap is not delayed/blocked.

input_driver = "udev"
input_joypad_driver = "udev"
joypad_autoconfig_dir = "/usr/share/zlyme/retroarch/autoconfig"
input_autodetect_enable = "true"
input_enable_hotkey_btn = "nul"
input_menu_toggle_btn = "10"
input_hotkey_block_delay = "0"
input_exit_emulator_btn = "nul"

video_threaded = "true"
video_hard_sync = "false"
video_frame_delay = "0"
video_max_swapchain_images = "3"
audio_latency = "64"
audio_out_rate = "48000"
rewind_enable = "false"
run_ahead_enabled = "false"
fastforward_frameskip = "true"
notification_show_autoconfig = "false"
