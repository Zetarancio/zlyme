# First-run seed only. Performance keys from spruceOS Flip PPSSPP.
# Launchers copy this when the user ini is missing; never overwrite.
[CPU]
CPUCore = 1
SeparateSASThread = True
IOTimingMethod = 0
FastMemoryAccess = True
FunctionReplacements = True
CPUSpeed = 111
[Graphics]
GraphicsBackend = 0 (OPENGL)
SoftwareRenderer = False
HardwareTransform = True
SoftwareSkinning = True
TextureFiltering = 1
InternalResolution = 1
HighQualityDepth = 1
FrameSkip = 2
FrameSkipType = 0
AutoFrameSkip = True
AnisotropyLevel = 4
MultiSampleLevel = 0
BufferFiltering = 1
VSync = False
BloomHack = 0
SplineBezierQuality = 1
HardwareTessellation = False
SkipGPUReadbacks = True
SkipGPUReadbackMode = 1
InflightFrames = 3
MultiThreading = True
UberShaderVertex = True
UberShaderFragment = True
[Sound]
Enable = True
AudioBackend = 0
ExtraAudioBuffering = False
# zlyme-pad-abi=xb360
# Device 10 is PPSSPP's SDL pad. Codes match ROCKNIX InputPlumber
# controls.ini (d519b223): Xbox face, not the RK3566 Nintendo set.
# Guide+Start is not bound here; zlyme-pak-hotkey owns that chord.
[ControlMapping]
Up = 10-19
Down = 10-20
Left = 10-21
Right = 10-22
Circle = 10-190
Cross = 10-189
Square = 10-191
Triangle = 10-188
Start = 10-197
Select = 10-196
L = 10-193
R = 10-192
An.Up = 10-4003
An.Down = 10-4002
An.Left = 10-4001
An.Right = 10-4000
RightAn.Up = 10-4007
RightAn.Down = 10-4006
RightAn.Left = 10-4005
RightAn.Right = 10-4004
