; First-run seed only. Performance keys from spruceOS Flip flycast.
; Launchers copy this when the user emu.cfg is missing; never overwrite.
; zlyme-pad-abi=xb360
; pak-input.sh exposes only the virtual xb360 pads. Flycast assigns SDL
; joystick index 0 to Maple port 1 and index 1 to port 2 at startup.
[input]
device1 = 0
device1.1 = 1
device1.2 = 1
device2 = 0
device2.1 = 1
device2.2 = 1

[config]
Dynarec.Enabled = yes
aica.DSPEnabled = no
pvr.AutoSkipFrame = 1
pvr.MaxThreads = 3
pvr.rend = 0
rend.DelayFrameSwapping = yes
rend.Resolution = 480
rend.ThreadedRendering = yes
rend.vsync = yes
ta.skip = 1
