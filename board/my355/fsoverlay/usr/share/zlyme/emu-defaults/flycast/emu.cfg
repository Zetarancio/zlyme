; First-run seed only. Performance keys from spruceOS Flip flycast.
; Launchers copy this when the user emu.cfg is missing; never overwrite.
; zlyme-pad-abi=xb360
; Joystick 0 is the virtual pad because pak-input.sh hides the physical one.
; Joystick 1 is the next InputPlumber xb360 target, when a second player exists.
[input]
device1 = 0
device1.1 = 1
device1.2 = 1
device2 = 0
device2.1 = 1
device2.2 = 1
maple_sdl_joystick_0 = 0
maple_sdl_joystick_1 = 1

[config]
Dynarec.Enabled = yes
aica.DSPEnabled = no
pvr.AutoSkipFrame = 1
pvr.MaxThreads = 3
pvr.rend = 0
rend.DelayFrameSwapping = yes
rend.Resolution = 480
rend.ThreadedRendering = yes
rend.vsync = yes
ta.skip = 1
