# Reference copy. ra-run does not copy this file. It copies
# /etc/retroarch.cfg when the user cfg is missing, then writes the
# theme line below if that new file has none. video_driver lives here
# so a hand-copied cfg can switch gl/vulkan and keep it.
#
# "2" is RGUI_THEME_CLASSIC_ORANGE in RetroArch 1.22.2
# menu/menu_defines.h. The menu labels it "Classic Orange".

video_driver = "gl"
video_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
video_font_enable = "false"
video_threaded = "true"
video_hard_sync = "false"
video_frame_delay = "0"
video_max_swapchain_images = "3"

audio_driver = "alsa"
audio_device = "default"
audio_latency = "64"
audio_out_rate = "48000"
audio_sync = "true"

input_driver = "sdl2"
input_joypad_driver = "sdl2"

libretro_directory = "/usr/lib/libretro"
system_directory = "/storage/Bios"
savefile_directory = "/storage/Saves"
savestate_directory = "/storage/Saves"
rgui_browser_directory = "/storage/Roms"
menu_driver = "rgui"
rgui_menu_color_theme = "2"

rewind_enable = "false"
run_ahead_enabled = "false"
fastforward_frameskip = "true"

notification_show_save_state = "true"
notification_show_screenshot = "true"
notification_show_autoconfig = "false"

joypad_autoconfig_dir = "/usr/share/retroarch/autoconfig"
input_autodetect_enable = "true"
input_enable_vibration = "true"
input_enable_hotkey_btn = "nul"
input_menu_toggle_btn = "5"
input_hotkey_block_delay = "0"
input_exit_emulator_btn = "nul"
input_menu_swap_ok_cancel_buttons = "false"
menu_show_core_updater = "false"
assets_directory = "/storage/.config/retroarch/assets"
