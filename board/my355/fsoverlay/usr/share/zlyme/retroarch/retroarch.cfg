# Stock RetroArch configuration. zlyme-stock-seed copies this file to
# /storage/.config/retroarch/retroarch.cfg when that file is missing
# or zero bytes, and again when the RetroArch configuration reset runs.
# ra-run does not edit the copy. A saved change stays until that reset.
#
# "2" is RGUI_THEME_CLASSIC_ORANGE in RetroArch 1.22.2
# menu/menu_defines.h. The menu labels it "Classic Orange".
# quit_on_close_content "2" is QUIT_ON_CLOSE_CONTENT_CLI: Close Content
# quits only when the process was started with a core or content argument.

video_driver = "gl"
video_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
video_font_enable = "false"
video_threaded = "true"
video_hard_sync = "false"
video_frame_delay = "0"
video_max_swapchain_images = "3"

audio_driver = "alsa"
audio_device = "default"
audio_latency = "64"
audio_out_rate = "48000"
audio_sync = "true"

input_driver = "sdl2"
input_joypad_driver = "udev"
# Player 1 is reserved for the InputPlumber virtual pad by name.
# Type 2 is INPUT_DEVICE_RESERVATION_RESERVED in RetroArch 1.22.2.
# The physical Flip pad has a different name, so it does not take
# this slot. ra-run uses SDL2 joypads instead when another pad has
# this same name, because that name no longer identifies one player.
input_player1_reserved_device = "Microsoft X-Box 360 pad"
input_player1_device_reservation_type = "2"

libretro_directory = "/storage/.config/retroarch/cores"
system_directory = "/storage/Bios"
savefile_directory = "/storage/Saves"
savestate_directory = "/storage/Saves"
savestate_auto_save = "true"
savestate_auto_load = "true"
quit_on_close_content = "2"
# RetroArch 1.22.2 defaults this to true. retroarch_main_quit then writes
# the running settings, including values loaded from --appendconfig.
# false leaves that quit path alone. Save Current Configuration still
# writes the running settings. The automatic savestate is a separate step.
config_save_on_exit = "false"
rgui_browser_directory = "/storage/Roms"
menu_driver = "rgui"
rgui_menu_color_theme = "2"

rewind_enable = "false"
run_ahead_enabled = "false"
fastforward_frameskip = "true"

notification_show_save_state = "true"
notification_show_screenshot = "true"
notification_show_autoconfig = "false"
notification_show_autoconfig_fails = "false"

joypad_autoconfig_dir = "/usr/share/retroarch/autoconfig"
input_autodetect_enable = "true"
input_enable_vibration = "true"
input_enable_hotkey_btn = "nul"
input_hotkey_block_delay = "0"
input_exit_emulator_btn = "nul"
# RetroArch 1.22.2 registers menu_swap_ok_cancel_buttons. The C field
# is input_menu_swap_ok_cancel_buttons, and a file key with that name
# is ignored. The compiled default is true, which makes RetroPad B the
# menu OK button. false keeps OK on RetroPad A.
menu_swap_ok_cancel_buttons = "false"
menu_show_core_updater = "false"
assets_directory = "/storage/.config/retroarch/assets"
