# InputPlumber xb360 target as the udev joypad driver sees it.
# Button numbers are evdev indices, not SDL gamecontroller ids.
# The live virtual pad sets BTN_SOUTH, BTN_EAST, BTN_NORTH, BTN_WEST
# and does not set BTN_C, so RetroArch's scan assigns 0..3 to A B X Y.
# Guide is button 8. MENU+START exit stays zlyme-pak-hotkey.
# Do not copy a generic Xbox profile that swaps A/B for a Nintendo pad.
input_driver = "udev"
input_device = "Microsoft X-Box 360 pad"
input_vendor_id = "1118"
input_product_id = "654"
input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_select_btn = "6"
input_start_btn = "7"
input_menu_toggle_btn = "8"
input_l3_btn = "9"
input_r3_btn = "10"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_l2_axis = "+2"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"
input_r2_axis = "+5"
