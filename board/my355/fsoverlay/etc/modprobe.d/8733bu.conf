# RTL8733BU module parameters. Required, not tuning.
#
# rtw_ips_mode=0 is the one that is not negotiable. IPS is the driver's "card
# disable" idle state, and on this device WiFi and Bluetooth are two interfaces
# on one chip sharing one firmware load -- so powering the block down to save
# WiFi idle current takes the Bluetooth firmware with it. Cutting power properly
# is rtl8733bu_power's job, via rfkill, and it only does it when both radios are
# blocked.
#
# The power-save settings are a choice with a measured downside. What is here is
# the most stable option:
#
#   rtw_power_mgnt=0 rtw_lps_level=0   radio power save mostly off; most stable
#                                      (this is what we ship)
#   rtw_power_mgnt=1 rtw_lps_level=1   moderate saving, behaves on hotspots
#   rtw_power_mgnt=2                   more aggressive; caused intermittent
#                                      HTTPS timeouts on some hotspots, so not
#                                      this, however tempting the idle figure
#
# These are runtime parameters, so changing them needs a reboot and not a
# rebuild.

options 8733bu rtw_ips_mode=0 rtw_power_mgnt=0 rtw_lps_level=0 rtw_lps_chk_by_tp=1 rtw_enusbss=0
