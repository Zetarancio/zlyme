# Bring up the WiFi/BT combo chip at boot.
#
# Loading rtl8733bu_power is enough for both halves: it owns the enable GPIO, so it
# powers the chip and registers its two rfkill devices unblocked, and its
# MODULE_SOFTDEP("post: 8733bu") pulls in the WiFi driver afterwards. That softdep
# is honoured by modprobe rather than by the kernel, which is why this system builds
# real kmod -- busybox's modprobe has never implemented softdep and would ignore it
# without saying so.
#
# This has to happen at boot rather than on demand: rtl8733bu_power is a
# platform driver (DT node), so there is no USB modalias for eudev to
# match. USB HID and disks come from eudev. btusb stays blacklisted
# until S35 (combo chip).
#
# Loaded by kmod's S11modules, which is early -- the chip then has until S30wifi to
# enumerate over USB, rather than S30wifi having to wait out the whole probe itself.
#
# btusb is deliberately not here. It has to come after the WiFi driver has finished
# with the chip, which is a sequencing problem rather than a list of modules; see
# S35btusb and /etc/modprobe.d/rtl8733bu-combo.conf.

rtl8733bu_power
