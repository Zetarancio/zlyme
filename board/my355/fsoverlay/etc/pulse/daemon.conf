# Nominal fragment is 1024 bytes: 256 frames of S16 stereo at 48 kHz,
# 256/48000 = 5.3 ms. Twelve fragments are 64 ms. That is PulseAudio's
# documented interrupt-mode default. Four fragments were 21.3 ms and
# measured 21017 µs on the codec sink. Not a listening result.
exit-idle-time = -1
flat-volumes = no
high-priority = no
realtime-scheduling = no
default-sample-format = s16le
default-sample-rate = 48000
default-sample-channels = 2
