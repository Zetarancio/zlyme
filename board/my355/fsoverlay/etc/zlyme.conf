# Writable state. Sourced by init scripts. /storage is the exFAT partition
# (label ZLYME). Config lives under .config so a backup is one directory.

ZLYME_STORAGE=/storage
ZLYME_CFG="${ZLYME_STORAGE}/.config"
ZLYME_DEFAULTS=/usr/share/zlyme
ZLYME_BOOT=/boot

# WiFi/udev/sshd used to start from inittab at the same moment as
# nextui.elf and steal the A55s. 20 s timeout so a hung list still
# brings SSH up.
wait_boot_list() {
	n=0
	while [ "$n" -lt 40 ]; do
		grep -q 'nextui-first-flip' /tmp/boot-timing 2>/dev/null && return 0
		sleep 0.5
		n=$((n + 1))
	done
	return 0
}
