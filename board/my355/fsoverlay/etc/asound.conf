# Three sinks: codec (rk817, speaker+headphones via the jack), HDMI, bt.
# Cards are named. The ALSA id is rk817ext. The kernel short name
# rk817_ext is not that id, and opening it by that name fails.
# HDMI is card 0 and rk817ext is card 1 on this board. The id is
# what clients use, not the number.
# The minimal image has no PipeWire plugin. Its default is the codec
# dmix. post-build.sh switches pcm.!default and ctl.!default to the
# PipeWire plugin when that package is selected. The flipsink_* devices
# stay addressable by name either way.

pcm.!default {
	type plug
	slave.pcm "flipdmix_codec"
}

# Mixer access always goes to the codec, whichever sink is playing, so that
# `amixer -c rk817ext` is one stable interface -- see the shared FlipVolume below.
ctl.!default {
	type hw
	card rk817ext
}

# ---------------------------------------------------------------------------
# One volume control for every sink.
#
# softvol *creates* the control it names, so this is deliberately not called
# "Master": colliding with a real hardware control of the same name is confusing at
# best. Every sink below points its softvol at this same name on the codec card --
# the control does not have to live on the card the audio goes to, and hosting it in
# one place means volume behaves identically on speaker, HDMI and Bluetooth, and is
# saved and restored by S20alsa as a single setting.
#
# HDMI is the reason this is not optional: an HDMI sink has no volume control of its
# own at all.
# ---------------------------------------------------------------------------

pcm.flipsink_codec {
	type plug
	slave.pcm "flipvol_codec"
}

pcm.flipvol_codec {
	type softvol
	slave.pcm "flipdmix_codec"
	control {
		name "FlipVolume"
		card rk817ext
	}
}

# dmix so a frontend's UI sound can play over an emulator: the hardware device is
# single-open, and without it the second opener simply gets EBUSY. It has to fix a
# rate and format, being the thing every client resamples into. ipc_key is
# arbitrary but must differ between dmix instances, or two sinks would rendezvous
# on the same shared segment.
#
# period_size and buffer_size are Batocera's, from its asoundrc-dmix+softvol.
# At 48 kHz, 2048 frames is 2048/48000 = 42.7 ms and 8192 frames is 170.7 ms.
# Those are nominal buffer durations, not a measured end-to-end latency.
# The default PCM no longer uses this dmix. PulseAudio opens the hardware
# device itself. These devices stay for a program that names them.
pcm.flipdmix_codec {
	type dmix
	ipc_key 3566
	slave {
		pcm "hw:rk817ext,0"
		rate 48000
		channels 2
		format S16_LE
		period_size 2048
		buffer_size 8192
	}
}

pcm.flipsink_hdmi {
	type plug
	slave.pcm "flipvol_hdmi"
}

pcm.flipvol_hdmi {
	type softvol
	slave.pcm "flipdmix_hdmi"
	control {
		name "FlipVolume"
		card rk817ext
	}
}

pcm.flipdmix_hdmi {
	type dmix
	ipc_key 3567
	slave {
		pcm "hw:HDMI,0"
		rate 48000
		channels 2
		format S16_LE
		period_size 2048
		buffer_size 8192
	}
}

# No dmix on Bluetooth: bluealsa is not a hw device and does not support the mmap
# access dmix needs. bluealsad already accepts one stream per connected device,
# which is all this sink can carry anyway.
pcm.flipsink_bt {
	type plug
	slave.pcm "flipvol_bt"
}

pcm.flipvol_bt {
	type softvol
	slave.pcm "bluealsa"
	control {
		name "FlipVolume"
		card rk817ext
	}
}
