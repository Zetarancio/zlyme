# Both images. default is PipeWire. hw_codec and hw_hdmi open the
# hardware devices for a diagnostic; nothing in the launchers uses them.

pcm.!default {
	type pipewire
}

ctl.!default {
	type pipewire
}

pcm.hw_codec {
	type hw
	card rk817ext
	device 0
}

pcm.hw_hdmi {
	type hw
	card HDMI
	device 0
}
