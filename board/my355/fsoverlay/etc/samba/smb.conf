[global]
	workgroup = WORKGROUP
	server string = Zlyme
	security = user
	map to guest = Never
	disable netbios = yes
	server min protocol = SMB2
	passdb backend = tdbsam
	private dir = /var/lib/samba/private
	load printers = no
	printcap name = /dev/null
	logging = 0

[storage]
	path = /storage
	browseable = yes
	writable = yes
	guest ok = no
	valid users = zlyme
	force user = root
	create mask = 0644
	directory mask = 0755
