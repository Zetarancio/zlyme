# Merged by ra-run --appendconfig on every launch (overrides the user
# cfg for these keys). video_driver is not listed here so a Vulkan
# backend saved in the user cfg can persist. First-run seed is
# usr/share/zlyme/retroarch/retroarch.cfg (copied once if missing).
#
# Keyboard/mice can be udev (ROCKNIX/Knulli on this SoC). SDL1 is not
# in this binary or in Buildroot. sdl2 GameController GUIDE is 5 (R1
# on the raw pad). Video is GLES/KMS unless the user cfg selects vulkan.
# Audio uses /etc/asound.conf.
#
# Performance keys match spruceOS Flip (threaded GL, 64 ms latency, no
# rewind/run-ahead). Do not set video_context_driver = sdl_gl — this
# image uses KMSDRM SDL, not spruce's windowed stack.

video_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
video_font_enable = "false"
video_threaded = "true"
video_hard_sync = "false"
video_frame_delay = "0"
video_max_swapchain_images = "3"

audio_driver = "alsa"
audio_device = "default"
audio_latency = "64"
audio_out_rate = "48000"
audio_sync = "true"

input_driver = "udev"
input_joypad_driver = "udev"

libretro_directory = "/usr/lib/libretro"
system_directory = "/storage/Bios"
savefile_directory = "/storage/Saves"
savestate_directory = "/storage/Saves"
rgui_browser_directory = "/storage/Roms"
menu_driver = "rgui"
rgui_menu_color_theme = "custom"
rgui_entry_normal_color = "0xFFF2F3F5"
rgui_entry_hover_color = "0xFFFA7C08"
rgui_title_color = "0xFFFA7C08"
rgui_bg_dark_color = "0xFF050608"
rgui_bg_light_color = "0xFF050608"
rgui_border_dark_color = "0xFFEC2A01"
rgui_border_light_color = "0xFFFA7C08"

rewind_enable = "false"
run_ahead_enabled = "false"
fastforward_frameskip = "true"

notification_show_save_state = "true"
notification_show_screenshot = "true"
notification_show_autoconfig = "false"
joypad_autoconfig_dir = "/usr/share/zlyme/retroarch/autoconfig"
input_autodetect_enable = "true"

# RA 1.22 blocks joypad hotkeys until Enable Hotkey is held.
# Leave Enable unbound; MENU is udev/js button 10 (BTN_MODE).
# MENU+Start exit is zlyme-pak-hotkey, not RetroArch quit.
input_enable_hotkey_btn = "nul"
input_menu_toggle_btn = "10"
input_hotkey_block_delay = "0"
input_exit_emulator_btn = "nul"
menu_show_core_updater = "false"
assets_directory = "/storage/.config/retroarch/assets"
