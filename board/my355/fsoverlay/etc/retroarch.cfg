# Defaults for a first RetroArch start. ra-run --appendconfig merges this
# even when /storage/.config/retroarch/retroarch.cfg already exists.
#
# No udev (devtmpfs only): input is SDL2. Video is GLES/KMS.
# Audio uses the default PCM from /etc/asound.conf.
#
# Performance keys match spruceOS Flip (threaded GL, 64 ms latency, no
# rewind/run-ahead). Do not set video_context_driver = sdl_gl — this
# image uses KMSDRM SDL, not spruce's windowed stack.

video_driver = "gl"
video_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
video_font_enable = "false"
video_threaded = "true"
video_hard_sync = "false"
video_frame_delay = "0"
video_max_swapchain_images = "3"

audio_driver = "alsa"
audio_device = "default"
audio_latency = "64"
audio_out_rate = "48000"
audio_sync = "true"

input_driver = "sdl2"
input_joypad_driver = "sdl2"

libretro_directory = "/usr/lib/libretro"
system_directory = "/storage/Bios"
savefile_directory = "/storage/Saves"
savestate_directory = "/storage/Saves"
rgui_browser_directory = "/storage/Roms"
menu_driver = "rgui"

rewind_enable = "false"
run_ahead_enabled = "false"
fastforward_frameskip = "true"

notification_show_save_state = "true"
notification_show_screenshot = "true"
notification_show_autoconfig = "false"

# NextUI MENU is button 10. Minarch quits on MENU; do the same.
# Select (8) toggles the RetroArch menu while MENU is held.
input_enable_hotkey_btn = "10"
input_exit_emulator_btn = "10"
input_menu_toggle_btn = "8"
