# RetroArch 1.22.2 installs its default file at this path. When the
# user file is missing, RetroArch copies this path as the skeleton.
# This overlay replaces that default. It has no settings. Zlyme's
# stock file is /usr/share/zlyme/retroarch/retroarch.cfg.
# zlyme-stock-seed copies that file when the user file is missing.
# ra-run does not append this file.
