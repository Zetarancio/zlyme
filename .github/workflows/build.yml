# Full my355 image. One board, one build.sh — not ROCKNIX's device/stage DAG.
#
# Secrets: GH_PAT (classic PAT, repo + workflow) to write the ccache repo.
# Optional variable CACHE_REPO (default zlyme-cache).
# Releases upload zlyme-my355-YYYYMMDD-*.tar, the matching .sha256, and zlyme.img.

name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write
  packages: read

env:
  CACHE_REPO: ${{ vars.CACHE_REPO || 'zlyme-cache' }}
  ZLYME_DEFCONFIG: zlyme_defconfig

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # Default max profile deletes docker-engine. The image job needs it.
      - uses: justinthelaw/maximize-github-runner-space@v0.12.2
        continue-on-error: true
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v4

      - name: Ensure Docker
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y docker.io
            sudo chmod 666 /var/run/docker.sock || true
          fi
          docker version

      - uses: docker/login-action@v3
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve ccache
        continue-on-error: true
        run: |
          url="https://github.com/${{ github.repository_owner }}/${{ env.CACHE_REPO }}/releases/download/ccache/ccache-my355.tar"
          curl -L --fail --silent --show-error "$url" | tar -xf - || echo "no ccache yet"

      - name: Pull or build zlyme-build
        run: |
          img="ghcr.io/${{ github.repository_owner }}/zlyme-build:latest"
          if ! docker pull "$img"; then
            docker build -t zlyme-build - < Dockerfile
          else
            docker tag "$img" zlyme-build
          fi

      - name: Build image
        run: |
          chmod +x ./build.sh
          ./build.sh --config "${ZLYME_DEFCONFIG}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zlyme-my355-${{ github.run_id }}
          path: |
            output/images/zlyme-my355-*.tar
            output/images/zlyme-my355-*.sha256
            output/images/zlyme.img
          if-no-files-found: error

      # /releases/latest is what Update.pak hits. Tag the run so a push
      # to main also publishes; workflow_dispatch on a branch is not a tag.
      - name: Release
        if: success() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('zlyme-{0}', github.run_id) }}
          name: zlyme ${{ github.run_id }}
          make_latest: true
          files: |
            output/images/zlyme-my355-*.tar
            output/images/zlyme-my355-*.sha256
            output/images/zlyme.img
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack ccache
        if: always()
        continue-on-error: true
        run: |
          if [ -d .ccache ]; then
            tar -cf ccache-my355.tar .ccache
          fi

      - name: Save ccache
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ccache
          name: ccache
          prerelease: true
          make_latest: false
          files: ccache-my355.tar
          repository: ${{ github.repository_owner }}/${{ env.CACHE_REPO }}
          token: ${{ secrets.GH_PAT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
