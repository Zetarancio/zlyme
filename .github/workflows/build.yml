# Full my355 image (zlyme_my355_defconfig). Hosted runners cap a single job
# at 360 minutes; a cold build is longer than that (cancelled at the cap:
# 34801512689, 34828905859). Sequential stages each compile for ~310 minutes,
# then pack ccache. Later stages skip if an earlier one already has the tar.
#
# Manual only: no push trigger, no daily cron. A private-repo cold build
# is ~930 runner-minutes (3×310). Public standard ubuntu-24.04 is free and
# 4 CPU / 16 GB (private is 2/8). cancel-in-progress is false so a second
# dispatch does not kill a running ccache/image job; it still queues.
#
# Secrets: GH_PAT (classic PAT, repo + workflow) to write the ccache repo.
# Optional variable CACHE_REPO (default zlyme-cache).
# A dispatch builds the image and uploads the stage artifacts. It publishes
# a stable release only when publish_release is true. The default is a
# candidate build: no GitHub release, and /releases/latest stays as it is.
# A published release uploads the full OTA, its sha256, zlyme.img,
# release-manifest.json, miyoo355_fw.img and its sha256, the standalone
# preloader helpers and their sha256 files, and any same-major delta tars
# the release job verified. None of the miyoo355_fw images are part of the
# OTA or release-manifest.json. Local builds do not generate deltas.

name: Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the stable/latest release after a successful build
        required: false
        type: boolean
        default: false

concurrency:
  group: zlyme-build
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  stage-a:
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: a
    secrets: inherit

  stage-b:
    needs: stage-a
    if: needs.stage-a.result == 'success' && needs.stage-a.outputs.have_image != 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: b
    secrets: inherit

  stage-c:
    needs: stage-b
    if: needs.stage-b.result == 'success' && needs.stage-b.outputs.have_image != 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: c
    secrets: inherit

  release:
    needs: [stage-a, stage-b, stage-c]
    if: >-
      always() && !cancelled() && inputs.publish_release == true &&
      (needs.stage-a.outputs.have_image == 'true' || needs.stage-b.outputs.have_image == 'true' || needs.stage-c.outputs.have_image == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: zlyme-my355-*
          merge-multiple: true
          path: output/images

      # /releases/latest is what Settings → Update hits. workflow_dispatch
      # is not a tag, so the tag is zlyme-<run_id>. Title is zlymeNN (date)
      # so the device can show the same string as Installed.
      - name: Release title
        id: title
        run: |
          set -euo pipefail
          zver=$(tr -d ' \t\r\n' < ZLYME_VERSION)
          shopt -s nullglob
          tars=(output/images/zlyme-my355-*.tar)
          tar=""
          if [ ${#tars[@]} -gt 0 ]; then
            tar=$(basename "${tars[0]}")
          fi
          ymd=$(printf '%s' "$tar" | sed -n 's/^zlyme-my355-\([0-9]\{8\}\).*/\1/p')
          if [ -n "$ymd" ]; then
            date="${ymd:0:4}-${ymd:4:2}-${ymd:6:2}"
          else
            date=$(date -u +%Y-%m-%d)
          fi
          if [ -z "$zver" ]; then
            zver=zlyme
          fi
          echo "name=${zver} (${date})" >> "$GITHUB_OUTPUT"

      - name: Assert OTA tar includes U-Boot
        run: |
          set -euo pipefail
          shopt -s nullglob
          full=""
          for tar in output/images/zlyme-my355-*.tar; do
            if tar -tf "$tar" | grep -qx zlyme; then
              full=$tar
              break
            fi
          done
          if [ -z "$full" ]; then
            echo "no full OTA tar" >&2
            exit 1
          fi
          names=$(tar -tf "$full")
          echo "$names" | grep -qx idbloader.img
          echo "$names" | grep -qx u-boot.itb

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Release manifest and deltas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/make-release-deltas.py \
            --images-dir output/images \
            --version-file ZLYME_VERSION \
            --source-sha "${{ github.sha }}" \
            --repo "${{ github.repository }}"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('zlyme-{0}', github.run_id) }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.title.outputs.name }}
          prerelease: false
          make_latest: true
          files: |
            output/images/zlyme-my355-*.tar
            output/images/zlyme-my355-*.sha256
            output/images/release-manifest.json
            output/images/zlyme.img
            output/images/miyoo355_fw.img
            output/images/miyoo355_fw.img.sha256
            output/images/miyoo355_fw-multiboot.img
            output/images/miyoo355_fw-multiboot.img.sha256
            output/images/miyoo355_fw-maskrom.img
            output/images/miyoo355_fw-maskrom.img.sha256
            output/images/miyoo355_fw-restore.img
            output/images/miyoo355_fw-restore.img.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
