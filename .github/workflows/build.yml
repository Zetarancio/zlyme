# Full my355 image. Hosted runners cap a single job at 360 minutes; a cold
# zlyme_defconfig build is longer than that (cancelled at the cap:
# 34801512689, 34828905859). Sequential stages each compile for ~310 minutes,
# then pack ccache. Later stages skip if an earlier one already has the tar.
#
# Manual only: no push trigger, no daily cron. A private-repo cold build
# is ~930 runner-minutes (3×310). Public standard ubuntu-24.04 is free and
# 4 CPU / 16 GB (private is 2/8). cancel-in-progress is false so a second
# dispatch does not kill a running ccache/image job; it still queues.
#
# Secrets: GH_PAT (classic PAT, repo + workflow) to write the ccache repo.
# Optional variable CACHE_REPO (default zlyme-cache).
# Releases upload zlyme-my355-YYYYMMDD-*.tar, the matching .sha256, and zlyme.img.

name: Build

on:
  workflow_dispatch:

concurrency:
  group: zlyme-build
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  stage-a:
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: a
    secrets: inherit

  stage-b:
    needs: stage-a
    if: needs.stage-a.result == 'success' && needs.stage-a.outputs.have_image != 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: b
    secrets: inherit

  stage-c:
    needs: stage-b
    if: needs.stage-b.result == 'success' && needs.stage-b.outputs.have_image != 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: c
    secrets: inherit

  release:
    needs: [stage-a, stage-b, stage-c]
    if: always() && !cancelled() && (needs.stage-a.outputs.have_image == 'true' || needs.stage-b.outputs.have_image == 'true' || needs.stage-c.outputs.have_image == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: zlyme-my355-*
          merge-multiple: true
          path: output/images

      # /releases/latest is what Update.pak hits. workflow_dispatch is
      # not a tag, so name the release after the run.
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('zlyme-{0}', github.run_id) }}
          name: zlyme ${{ github.run_id }}
          make_latest: true
          files: |
            output/images/zlyme-my355-*.tar
            output/images/zlyme-my355-*.sha256
            output/images/zlyme.img
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
