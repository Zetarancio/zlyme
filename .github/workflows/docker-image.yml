# Build and push ghcr.io/<owner>/zlyme-build:latest.
# GHCR repository names must be lowercase. The GitHub owner keeps its
# real spelling for login; only the image path is lowercased.

name: Docker image

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - .github/workflows/docker-image.yml

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          img="ghcr.io/${owner}/zlyme-build:latest"
          docker build -t "$img" - < Dockerfile
          docker push "$img"
