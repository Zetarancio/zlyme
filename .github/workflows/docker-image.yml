# Build the Zlyme build container.
# ghcr.io/<owner>/zlyme-build:latest is the production image. Only a
# push or a manual run on main may publish that tag. A development
# branch may build the image and must not overwrite it.

name: Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/docker-image.yml

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          id=$(sha256sum Dockerfile | awk '{print $1}')
          docker build --label "zlyme.dockerfile=${id}" -t zlyme-build - < Dockerfile
          have=$(docker image inspect -f '{{ index .Config.Labels "zlyme.dockerfile" }}' zlyme-build)
          test "$have" = "$id"
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push production latest
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          img="ghcr.io/${owner}/zlyme-build:latest"
          docker tag zlyme-build "$img"
          docker push "$img"
