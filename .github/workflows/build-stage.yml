# One hosted-runner job. GitHub kills the VM at 360 minutes (runs
# 34801512689 and 34828905859 were cancelled there during a cold image).
# Stop compile ~50 minutes early so ccache can be packed while the job
# is still allowed to run. The next stage starts a fresh output/ and
# relies on ccache hits. The output tree is not an artifact. The Actions
# cache is the primary compiler store. The zlyme-cache release file is only
# a fallback seed, and it is not allowed to shrink the Actions cache.

name: Build stage

on:
  workflow_call:
    inputs:
      stage:
        description: Stage id (a, b, c) for cache keys
        type: string
        required: true
    outputs:
      have_image:
        description: true if this stage wrote output/images/zlyme-my355-*.tar
        value: ${{ jobs.image.outputs.have_image }}

env:
  CACHE_REPO: ${{ vars.CACHE_REPO || 'zlyme-cache' }}
  ZLYME_DEFCONFIG: zlyme_my355_defconfig
  # Leave headroom under the 360-minute hard cap for cache save + upload.
  BUILD_WINDOW: 310m

jobs:
  image:
    # Matches the caller. A broader token here is rejected before the job starts.
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      have_image: ${{ steps.build.outputs.have_image }}
    steps:
      # Default max profile deletes docker-engine. This job needs it.
      - uses: justinthelaw/maximize-github-runner-space@ab8cbab7abef3d8a2565cc7827c22ffd462202be # v0.12.2
        continue-on-error: true
        with:
          skip-components: docker-engine

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure Docker
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y docker.io
            sudo chmod 666 /var/run/docker.sock || true
          fi
          sudo apt-get install -y zstd ccache
          docker version

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore ccache (Actions cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        continue-on-error: true
        with:
          path: .ccache
          key: ccache-my355-${{ github.run_id }}-${{ inputs.stage }}
          restore-keys: |
            ccache-my355-${{ github.run_id }}-
            ccache-my355-

      - name: Restore ccache (zlyme-cache release)
        continue-on-error: true
        run: |
          if [ -d .ccache ] && [ -n "$(ls -A .ccache 2>/dev/null)" ]; then
            echo "Actions cache already restored .ccache"
            exit 0
          fi
          owner="${{ github.repository_owner }}"
          base="https://github.com/${owner}/${CACHE_REPO}/releases/download/ccache"
          if curl -L --fail --silent --show-error -o /tmp/ccache.zst "${base}/ccache-my355.tar.zst"; then
            zstd -d -c /tmp/ccache.zst | tar -xf -
          elif curl -L --fail --silent --show-error "${base}/ccache-my355.tar" | tar -xf -; then
            echo "restored uncompressed ccache tarball"
          else
            echo "no ccache yet"
          fi

      # The restored ccache.conf still says 1.5G until this runs. -M writes
      # that file and does not delete objects. 8GiB is the experiment size.
      - name: Raise ccache limit
        run: sh scripts/ci/ccache-raise-limit.sh .ccache 8GiB

      - name: Pull approved build container
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: sh scripts/ci/pull-approved-build-container.sh

      # Debian ccache in this image reads CCACHE_DIR. Buildroot's later
      # host ccache reads the same directory through BR_CACHE_DIR. Both
      # use .ccache/ccache.conf, which the previous step just wrote.
      - name: Check ccache limit inside the build container
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CCACHE_DIR=/zlyme/ccache \
            -v "$PWD/.ccache:/zlyme/ccache" \
            zlyme-build \
            sh -c 'grep -n max_size /zlyme/ccache/ccache.conf; ccache -p'
          seen=$(docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e CCACHE_DIR=/zlyme/ccache \
            -v "$PWD/.ccache:/zlyme/ccache" \
            zlyme-build \
            ccache -k max_size)
          sh scripts/ci/ccache-limit-matches.sh 8GiB "$seen"
          grep -Eq '^max_size = 8GiB$' .ccache/ccache.conf

      - name: ARMHF runtime
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: zlyme-armhf-runtime
          path: armhf-artifact

      - name: Check ARMHF runtime
        run: |
          set -euo pipefail
          chmod +x ./scripts/armhf-runtime-unpack.sh
          ./scripts/armhf-runtime-unpack.sh armhf-artifact/zlyme-armhf-runtime.tar output-armhf

      - name: Record restored ccache stats
        run: sh scripts/ci/ccache-stage-stats.sh begin .ccache output/ccache-stage-begin.txt

      - name: Build image
        id: build
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
          ZLYME_REQUIRE_SCRAPEGOAT_CREDENTIALS: "1"
        run: |
          echo "have_image=false" >> "$GITHUB_OUTPUT"
          if [ -z "${SCREENSCRAPER_DEV_ID}" ] || [ -z "${SCREENSCRAPER_DEV_PASSWORD}" ]; then
            echo "ScreenScraper developer credentials are required for this build" >&2
            exit 1
          fi
          chmod +x ./build.sh scripts/ci/stream-build-log.sh scripts/ci/product-image-present.sh scripts/ci/stage-outcome.sh
          set +e
          mkdir -p output
          start_epoch=$(date +%s)
          # Full log is the artifact. The console streams lifecycle lines.
          # stream-build-log.sh returns the build status, not grep's.
          ZLYME_LOG_TIMESTAMPS=1 bash scripts/ci/stream-build-log.sh output/zlyme-build.log \
            timeout --signal=TERM -k 3m "${BUILD_WINDOW}" ./build.sh --config "${ZLYME_DEFCONFIG}"
          rc=$?
          elapsed=$(( $(date +%s) - start_epoch ))
          echo "source=${{ github.sha }}"
          echo "elapsed_s=${elapsed}"
          echo "build_rc=${rc}"
          if ./scripts/ci/product-image-present.sh output/images; then
            echo "files=complete"
          else
            echo "files=incomplete"
          fi
          ls -l output/images/zlyme-my355-*.tar output/images/zlyme-my355-*.sha256 output/images/zlyme.img output/images/zlyme.img.sha256 2>/dev/null || true
          if [ "$rc" != 0 ]; then
            case "$rc" in
              124|137|143) ;;
              *) tail -n 40 output/zlyme-build.log || true ;;
            esac
          fi
          docker ps -aq | xargs -r docker stop || true
          docker ps -aq | xargs -r docker rm -f || true
          sh scripts/ci/stage-outcome.sh "$rc" output/images >> "$GITHUB_OUTPUT"
          exit $?

      - name: Assert OTA tar includes U-Boot
        if: steps.build.outputs.have_image == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          tars=(output/images/zlyme-my355-*.tar)
          if [ ${#tars[@]} -eq 0 ]; then
            echo "no OTA tar" >&2
            exit 1
          fi
          names=$(tar -tf "${tars[0]}")
          echo "$names" | grep -qx idbloader.img
          echo "$names" | grep -qx u-boot.itb

      - name: Record stage ccache stats
        if: always()
        run: |
          sh scripts/ci/ccache-stage-stats.sh end .ccache output/ccache-stage-end.txt
          python3 scripts/ci/summarize_build_durations.py output/zlyme-build.log |
            tee output/build-durations.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zlyme-build-log-${{ github.run_id }}-${{ inputs.stage }}
          retention-days: 7
          path: |
            output/zlyme-build.log
            output/ccache-stage-begin.txt
            output/ccache-stage-begin.txt.raw
            output/ccache-stage-end.txt
            output/ccache-stage-end.txt.raw
            output/build-durations.txt
          if-no-files-found: ignore

      - name: Upload artifacts
        if: steps.build.outputs.have_image == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zlyme-my355-${{ github.run_id }}
          retention-days: 1
          path: |
            output/images/zlyme-my355-*.tar
            output/images/zlyme-my355-*.sha256
            output/images/zlyme.img
            output/images/zlyme.img.sha256
            output/images/miyoo355_fw.img
            output/images/miyoo355_fw.img.sha256
            output/images/miyoo355_fw-multiboot.img
            output/images/miyoo355_fw-multiboot.img.sha256
            output/images/miyoo355_fw-maskrom.img
            output/images/miyoo355_fw-maskrom.img.sha256
            output/images/miyoo355_fw-restore.img
            output/images/miyoo355_fw-restore.img.sha256
          if-no-files-found: error

      # One 8GiB cache plus the ARMHF caches fits in the included 10 GB.
      # Saving another 8GiB does not. GitHub deletes the oldest accessed
      # caches, so the cache saved here is the one the next stage restores.
      # Do not prune it to fit the 2 GiB release-file fallback.
      - name: Save ccache (Actions cache)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ccache
          key: ccache-my355-${{ github.run_id }}-${{ inputs.stage }}

      - name: Pack ccache fallback
        id: fallback
        if: always()
        continue-on-error: true
        run: |
          docker ps -aq | xargs -r docker rm -f || true
          sh scripts/ci/pack-ccache-fallback.sh .ccache ccache-my355.tar.zst >> "$GITHUB_OUTPUT"

      - name: Save ccache (zlyme-cache release)
        if: always() && steps.fallback.outputs.upload == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ccache
          name: ccache
          prerelease: true
          make_latest: false
          files: ccache-my355.tar.zst
          repository: ${{ github.repository_owner }}/${{ env.CACHE_REPO }}
          token: ${{ secrets.GH_PAT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
