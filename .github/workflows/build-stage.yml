# One hosted-runner job. GitHub kills the VM at 360 minutes (runs
# 34801512689 and 34828905859 were cancelled there during a cold image).
# Stop compile ~50 minutes early so ccache can be packed while the job
# is still allowed to run. The next stage starts a fresh output/ and
# relies on ccache hits; the 51G output tree cannot be an artifact.

name: Build stage

on:
  workflow_call:
    inputs:
      stage:
        description: Stage id (a, b, c) for cache keys
        type: string
        required: true
    outputs:
      have_image:
        description: true if this stage wrote output/images/zlyme-my355-*.tar
        value: ${{ jobs.image.outputs.have_image }}

permissions:
  contents: write
  packages: read

env:
  CACHE_REPO: ${{ vars.CACHE_REPO || 'zlyme-cache' }}
  ZLYME_DEFCONFIG: zlyme_my355_defconfig
  # Leave headroom under the 360-minute hard cap for cache save + upload.
  BUILD_WINDOW: 310m

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      have_image: ${{ steps.build.outputs.have_image }}
    steps:
      # Default max profile deletes docker-engine. This job needs it.
      - uses: justinthelaw/maximize-github-runner-space@v0.12.2
        continue-on-error: true
        with:
          skip-components: docker-engine

      - uses: actions/checkout@v7

      - name: Ensure Docker
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y docker.io
            sudo chmod 666 /var/run/docker.sock || true
          fi
          sudo apt-get install -y zstd ccache
          docker version

      - uses: docker/login-action@v4
        continue-on-error: true
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore ccache (Actions cache)
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .ccache
          key: ccache-my355-${{ github.run_id }}-${{ inputs.stage }}
          restore-keys: |
            ccache-my355-${{ github.run_id }}-
            ccache-my355-

      - name: Restore ccache (zlyme-cache release)
        continue-on-error: true
        run: |
          if [ -d .ccache ] && [ -n "$(ls -A .ccache 2>/dev/null)" ]; then
            echo "Actions cache already restored .ccache"
            exit 0
          fi
          owner="${{ github.repository_owner }}"
          base="https://github.com/${owner}/${CACHE_REPO}/releases/download/ccache"
          if curl -L --fail --silent --show-error -o /tmp/ccache.zst "${base}/ccache-my355.tar.zst"; then
            zstd -d -c /tmp/ccache.zst | tar -xf -
          elif curl -L --fail --silent --show-error "${base}/ccache-my355.tar" | tar -xf -; then
            echo "restored uncompressed ccache tarball"
          else
            echo "no ccache yet"
          fi

      - name: Pull or build zlyme-build
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          img="ghcr.io/${owner}/zlyme-build:latest"
          if ! docker pull "$img"; then
            docker build -t zlyme-build - < Dockerfile
          else
            docker tag "$img" zlyme-build
          fi

      - name: Build image
        id: build
        env:
          SCREENSCRAPER_DEV_ID: ${{ secrets.SCREENSCRAPER_DEV_ID }}
          SCREENSCRAPER_DEV_PASSWORD: ${{ secrets.SCREENSCRAPER_DEV_PASSWORD }}
          ZLYME_REQUIRE_SCRAPEGOAT_CREDENTIALS: "1"
        run: |
          echo "have_image=false" >> "$GITHUB_OUTPUT"
          if [ -z "${SCREENSCRAPER_DEV_ID}" ] || [ -z "${SCREENSCRAPER_DEV_PASSWORD}" ]; then
            echo "ScreenScraper developer credentials are required for this build" >&2
            exit 1
          fi
          chmod +x ./build.sh scripts/ci/stream-build-log.sh
          set +e
          mkdir -p output
          start_epoch=$(date +%s)
          # Full log is the artifact. The console streams lifecycle lines.
          # stream-build-log.sh returns the build status, not grep's.
          bash scripts/ci/stream-build-log.sh output/zlyme-build.log \
            timeout --signal=TERM -k 3m "${BUILD_WINDOW}" ./build.sh --config "${ZLYME_DEFCONFIG}"
          rc=$?
          elapsed=$(( $(date +%s) - start_epoch ))
          echo "source=${{ github.sha }}"
          echo "elapsed_s=${elapsed}"
          if compgen -G "output/images/zlyme-my355-*.tar" >/dev/null; then
            echo "image=produced"
          else
            echo "image=absent"
          fi
          ls -l output/images/zlyme-my355-*.tar output/images/zlyme-my355-*.sha256 output/images/zlyme.img output/images/zlyme.img.sha256 2>/dev/null || true
          if command -v ccache >/dev/null 2>&1; then
            CCACHE_DIR="${GITHUB_WORKSPACE:-$PWD}/.ccache" ccache -s || true
          fi
          if ! compgen -G "output/images/zlyme-my355-*.tar" >/dev/null; then
            case "$rc" in
              124|137|143) ;;
              *) tail -n 40 output/zlyme-build.log || true ;;
            esac
          fi
          docker ps -aq | xargs -r docker stop || true
          docker ps -aq | xargs -r docker rm -f || true
          if compgen -G "output/images/zlyme-my355-*.tar" >/dev/null; then
            echo "have_image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 124 = GNU timeout, 137 = SIGKILL, 143 = SIGTERM
          case "$rc" in
            124|137|143)
              echo "Build window closed without an image; next stage continues from ccache."
              exit 0
              ;;
          esac
          exit "$rc"

      - name: Assert OTA tar includes U-Boot
        if: steps.build.outputs.have_image == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          tars=(output/images/zlyme-my355-*.tar)
          if [ ${#tars[@]} -eq 0 ]; then
            echo "no OTA tar" >&2
            exit 1
          fi
          names=$(tar -tf "${tars[0]}")
          echo "$names" | grep -qx idbloader.img
          echo "$names" | grep -qx u-boot.itb

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zlyme-build-log-${{ github.run_id }}-${{ inputs.stage }}
          retention-days: 7
          path: output/zlyme-build.log
          if-no-files-found: ignore

      - name: Upload artifacts
        if: steps.build.outputs.have_image == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zlyme-my355-${{ github.run_id }}
          retention-days: 1
          path: |
            output/images/zlyme-my355-*.tar
            output/images/zlyme-my355-*.sha256
            output/images/zlyme.img
            output/images/zlyme.img.sha256
            output/images/miyoo355_fw.img
            output/images/miyoo355_fw.img.sha256
            output/images/miyoo355_fw-multiboot.img
            output/images/miyoo355_fw-multiboot.img.sha256
            output/images/miyoo355_fw-maskrom.img
            output/images/miyoo355_fw-maskrom.img.sha256
            output/images/miyoo355_fw-restore.img
            output/images/miyoo355_fw-restore.img.sha256
          if-no-files-found: error

      # Save before prune so the next stage of this run keeps the full cache.
      - name: Save ccache (Actions cache)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-my355-${{ github.run_id }}-${{ inputs.stage }}

      - name: Pack ccache
        if: always()
        continue-on-error: true
        run: |
          docker ps -aq | xargs -r docker rm -f || true
          if [ ! -d .ccache ]; then
            echo "no .ccache"
            exit 0
          fi
          CCACHE_DIR="$PWD/.ccache" ccache -M 1.5G -c || true
          tar --exclude='.ccache/tmp' -C . -cf - .ccache | zstd -T0 -3 -o ccache-my355.tar.zst
          ls -lh ccache-my355.tar.zst

      - name: Save ccache (zlyme-cache release)
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ccache
          name: ccache
          prerelease: true
          make_latest: false
          files: ccache-my355.tar.zst
          repository: ${{ github.repository_owner }}/${{ env.CACHE_REPO }}
          token: ${{ secrets.GH_PAT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
